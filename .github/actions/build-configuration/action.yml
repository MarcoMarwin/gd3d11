name: 'Build configuration'
description: 'Build one validated GD3D11 configuration and upload its DLL/PDB artifacts.'

inputs:
  configuration:
    description: "MSBuild configuration to build (e.g. Release, Release_AVX, Spacer_NET)"
    required: true
  project:
    description: "Path to the vcxproj file that should be built"
    required: true
  output-file:
    description: "Name of the build artifact"
    required: true

runs:
  using: composite
  steps:
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        nuget restore Direct3D7Wrapper.sln -NonInteractive -ConfigFile NuGet.config
        if ($LASTEXITCODE -ne 0) {
          throw "NuGet restore failed with exit code $LASTEXITCODE."
        }

    - name: Run MSBuild
      id: build
      shell: pwsh
      env:
        GD3D11_CONFIGURATION: ${{ inputs.configuration }}
        GD3D11_PROJECT: ${{ inputs.project }}
        GD3D11_OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        $ErrorActionPreference = "Stop"

        $configuration = $env:GD3D11_CONFIGURATION
        $projectInput = $env:GD3D11_PROJECT
        $outputFile = $env:GD3D11_OUTPUT_FILE
        if ($configuration -notmatch '^[A-Za-z0-9_]+$') {
          throw "Invalid build configuration: $configuration"
        }
        if (
          [IO.Path]::GetFileName($outputFile) -ne $outputFile -or
          [IO.Path]::GetExtension($outputFile) -ne ".dll" -or
          $outputFile -notmatch '^[A-Za-z0-9_.-]+$'
        ) {
          throw "Invalid output file name: $outputFile"
        }

        $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
        $workspacePrefix = $workspaceRoot.TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
        $projectPath = [IO.Path]::GetFullPath((Join-Path $workspaceRoot $projectInput))
        if (
          -not $projectPath.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase) -or
          [IO.Path]::GetExtension($projectPath) -ne ".vcxproj" -or
          -not (Test-Path -LiteralPath $projectPath -PathType Leaf)
        ) {
          throw "Invalid project path: $projectInput"
        }

        $outputName = [IO.Path]::GetFileNameWithoutExtension($outputFile)
        $outputDir = Join-Path $workspaceRoot "outputs"
        New-Item -Path $outputDir -ItemType Directory -Force | Out-Null
        $outputDirArgument = $outputDir.TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar

        $msbuildArgs = @(
          $projectPath,
          "/m",
          "/p:Configuration=$configuration",
          "/p:Platform=Win32",
          "/p:TargetName=$outputName",
          "/p:OutDir=$outputDirArgument",
          "/p:Deterministic=true",
          "/p:ContinuousIntegrationBuild=true"
        )

        & msbuild @msbuildArgs
        if ($LASTEXITCODE -ne 0) {
          throw "MSBuild failed with exit code $LASTEXITCODE."
        }

        $artifactBasePath = Join-Path $outputDir $outputName
        foreach ($extension in ".dll", ".pdb") {
          $artifactPath = "$artifactBasePath$extension"
          if (-not (Test-Path -LiteralPath $artifactPath -PathType Leaf)) {
            throw "Expected build output is missing: $artifactPath"
          }
        }

        "artifact-base-path=$artifactBasePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.configuration }}
        path: |
          ${{ steps.build.outputs.artifact-base-path }}.dll
          ${{ steps.build.outputs.artifact-base-path }}.pdb
        if-no-files-found: error
        compression-level: 1
        retention-days: 2
